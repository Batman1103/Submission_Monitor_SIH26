services:
  - type: web
    name: sih-submission-monitor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SIH_SYNC_MINUTES
        value: "5"
      - key: CORS_ORIGINS
        sync: false
